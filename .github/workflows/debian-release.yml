name: Build Debian package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Debian
        run: |
          apt-get update
          apt-get dist-upgrade -y

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            debhelper \
            debhelper-compat \
            dh-python \
            dh-sequence-python3 \
            pybuild-plugin-pyproject \
            python3-all \
            python3-hatchling \
            desktop-file-utils \
            appstream \
            lintian \
            ca-certificates \
            git

      - name: Create build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$(dirname "$GITHUB_WORKSPACE")"

      - name: Build package
        run: |
          su - builder -c \
            "cd '$GITHUB_WORKSPACE' && dpkg-buildpackage -us -uc -b"

      - name: Find package
        id: package
        run: |
          pkg="$(find "$(dirname "$GITHUB_WORKSPACE")" \
            -maxdepth 1 \
            -type f \
            -name 'smilemplayer_*.deb' \
            -print -quit)"

          if [ -z "$pkg" ]; then
            echo "ERROR: No Debian package was produced."
            exit 1
          fi

          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "Built package: $pkg"

      - name: Run lintian
        run: |
          lintian \
            "${{ steps.package.outputs.pkg }}"

      - name: Verify package
        run: |
          dpkg-deb --info \
            "${{ steps.package.outputs.pkg }}"

          dpkg-deb --contents \
            "${{ steps.package.outputs.pkg }}"

      - name: Prepare Debian package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp ../smilemplayer_*.deb "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: smilemplayer-debian-package
          path: artifacts/*.deb





      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="${GITHUB_REF_NAME}"

          commit_message="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["message"])'
          )"

          notes="$(printf '%s\n' "$commit_message" | sed '1d')"

          release_json="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${title}" \
            || true
          )"

          if printf '%s' "$release_json" |
              python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if "id" in d else 1)' \
              2>/dev/null; then

              echo "Release ${title} already exists."

              release_id="$(
                printf '%s' "$release_json" |
                python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])'
              )"

              upload_url="$(
                printf '%s' "$release_json" |
                python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"])'
              )"

              curl -fsSL -X PATCH \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                -d "$(
                  python3 -c \
                    'import json,sys; print(json.dumps({"name":sys.argv[1],"body":sys.argv[2]}))' \
                    "$title" "$notes"
                )" \
                >/dev/null

          else

              echo "Creating release ${title}."

              release_json="$(
                curl -fsSL -X POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
                  -d "$(
                    python3 -c \
                      'import json,sys; print(json.dumps({"tag_name":sys.argv[1],"name":sys.argv[1],"body":sys.argv[2],"draft":False,"prerelease":False}))' \
                      "$title" "$notes"
                  )"
              )"

              upload_url="$(
                printf '%s' "$release_json" |
                python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"])'
              )"
          fi

          pkg="${{ steps.package.outputs.pkg }}"
          asset_name="$(basename "$pkg")"

          upload_url="${upload_url%\{*}"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${pkg}" \
            "${upload_url}?name=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$asset_name")" \
            >/dev/null

          echo "Uploaded ${asset_name} to ${title}."
