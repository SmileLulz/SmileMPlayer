name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  arch:
    name: Build Arch package
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Arch Linux
        run: |
          pacman -Syu --noconfirm

      - name: Install build dependencies
        run: |
          pacman -S --noconfirm \
            base-devel \
            git \
            namcap \
            python \
            pyside6 \
            qt6-multimedia-ffmpeg \
            python-mutagen \
            python-dbus-next \
            ttf-jetbrains-mono-nerd \
            python-hatchling \
            python-build \
            python-installer

      - name: Create build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          su - builder -c \
            "cd '$GITHUB_WORKSPACE' && \
             makepkg --nodeps --noconfirm --cleanbuild --clean"

      - name: Find package
        id: package
        run: |
          pkg="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name '*.pkg.tar.zst' \
            -print -quit)"

          if [ -z "$pkg" ]; then
            echo "ERROR: No Arch package was produced."
            exit 1
          fi

          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "Built: $pkg"

      - name: Run namcap
        run: |
          namcap "${{ steps.package.outputs.pkg }}"

      - name: Verify package
        run: |
          pacman -Qip "${{ steps.package.outputs.pkg }}"
          pacman -Qlp "${{ steps.package.outputs.pkg }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: smilemplayer-arch-package
          path: '*.pkg.tar.zst'
          if-no-files-found: error

  debian:
    name: Build Debian package
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: debian:trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Debian
        run: |
          apt-get update
          apt-get dist-upgrade -y

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            debhelper \
            debhelper-compat \
            dh-python \
            dh-sequence-python3 \
            pybuild-plugin-pyproject \
            python3-all \
            python3-hatchling \
            desktop-file-utils \
            appstream \
            lintian \
            ca-certificates \
            git

      - name: Create build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$(dirname "$GITHUB_WORKSPACE")"

      - name: Build package
        run: |
          su - builder -c \
            "cd '$GITHUB_WORKSPACE' && \
             dpkg-buildpackage -us -uc -b"

      - name: Find package
        id: package
        run: |
          pkg="$(find "$(dirname "$GITHUB_WORKSPACE")" \
            -maxdepth 1 \
            -type f \
            -name 'smilemplayer_*.deb' \
            -print -quit)"

          if [ -z "$pkg" ]; then
            echo "ERROR: No Debian package was produced."
            exit 1
          fi

          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "Built: $pkg"

      - name: Run lintian
        run: |
          lintian "${{ steps.package.outputs.pkg }}"

      - name: Verify package
        run: |
          dpkg-deb --info "${{ steps.package.outputs.pkg }}"
          dpkg-deb --contents "${{ steps.package.outputs.pkg }}"

      - name: Prepare package artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "${{ steps.package.outputs.pkg }}" \
             "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: smilemplayer-debian-package
          path: artifacts/*.deb
          if-no-files-found: error

  fedora:
    name: Build Fedora RPM
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: fedora:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Fedora
        run: |
          dnf -y upgrade

      - name: Install build dependencies
        run: |
          dnf -y install \
            rpm-build \
            rpmdevtools \
            python3-devel \
            python3-hatchling \
            python3-pip \
            python3-dbus-next \
            python3-mutagen \
            python3-pyside6 \
            desktop-file-utils \
            appstream \
            rpmlint \
            spectool

      - name: Create build tree
        run: |
          mkdir -p rpm/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

      - name: Create build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Download release source
        run: |
          spectool -g -R \
            --define "_topdir $GITHUB_WORKSPACE/rpm" \
            rpm/SPECS/smilemplayer.spec

      - name: Verify source archive
        run: |
          ls -lh rpm/SOURCES/

      - name: Build RPM
        run: |
          su - builder -c \
            "cd '$GITHUB_WORKSPACE' && \
             rpmbuild \
               --define '_topdir $GITHUB_WORKSPACE/rpm' \
               -ba rpm/SPECS/smilemplayer.spec"

      - name: Find package
        id: package
        run: |
          pkg="$(find "$GITHUB_WORKSPACE/rpm/RPMS" \
            -type f \
            -name '*.rpm' \
            -not -name '*-debuginfo-*.rpm' \
            -print -quit)"

          if [ -z "$pkg" ]; then
            echo "ERROR: No RPM was produced."
            exit 1
          fi

          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          echo "Built: $pkg"

      - name: Run rpmlint
        run: |
          rpmlint "${{ steps.package.outputs.pkg }}"

      - name: Verify package
        run: |
          rpm -qip "${{ steps.package.outputs.pkg }}"
          rpm -qpl "${{ steps.package.outputs.pkg }}"

      - name: Prepare package artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "${{ steps.package.outputs.pkg }}" \
             "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: smilemplayer-fedora-rpm
          path: artifacts/*.rpm
          if-no-files-found: error

  wheel:
    name: Build Python wheel
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: python:3.14-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl
          python -m pip install --no-cache-dir \
            build \
            hatchling \
            twine

      - name: Build wheel
        run: |
          python -m build --wheel --no-isolation

      - name: Find wheel
        id: package
        run: |
          wheel="$(find dist \
            -maxdepth 1 \
            -type f \
            -name '*.whl' \
            -print -quit)"

          if [ -z "$wheel" ]; then
            echo "ERROR: No wheel was produced."
            exit 1
          fi

          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "Built: $wheel"

      - name: Verify wheel
        run: |
          python -m twine check "${{ steps.package.outputs.wheel }}"

      - name: Verify universal wheel
        run: |
          case "$(basename "${{ steps.package.outputs.wheel }}")" in
            *-py3-none-any.whl)
              echo "Universal Python wheel confirmed."
              ;;
            *)
              echo "ERROR: Expected a py3-none-any wheel."
              exit 1
              ;;
          esac

      - name: Inspect wheel
        run: |
          python -m zipfile -l "${{ steps.package.outputs.wheel }}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: smilemplayer-python-wheel
          path: dist/*.whl
          if-no-files-found: error

  windows:
    name: Build Windows packages
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build PyInstaller onedir
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

          python -m PyInstaller `
            --clean `
            --noconfirm `
            smilemplayer.spec

          if (-not (Test-Path "dist\SmileMPlayer\SmileMPlayer.exe")) {
            Write-Error "PyInstaller onedir build failed."
            exit 1
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $version = python installer\get_version.py
          $zip = "SmileMPlayer-$version-windows-x64.zip"

          Compress-Archive `
            -Path "dist\SmileMPlayer\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Write-Host "Created $zip"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source

          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null

          & $iscc "installer\SmileMPlayer.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed."
            exit $LASTEXITCODE
          }

          $installer = Get-ChildItem `
            "dist\installer" `
            -Filter "*.exe" `
            -File `
            -ErrorAction SilentlyContinue

          if ($installer.Count -ne 1) {
            Write-Error "Expected exactly one Inno Setup installer, found $($installer.Count)."
            Get-ChildItem "dist\installer" -Force
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "windows-release" | Out-Null

          $version = (python installer\get_version.py).Trim()
          $installerName = "SmileMPlayer-$version-windows-x64-setup.exe"

          Copy-Item `
            $installer.FullName `
            "windows-release\$installerName"

          Write-Host "Staged installer:"
          Get-Item "windows-release\$installerName" |
            Select-Object Name, Length, FullName

      - name: Build PyInstaller onefile
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

          $env:SMILEMPLAYER_ONEFILE = "1"

          python -m PyInstaller `
            --clean `
            --noconfirm `
            smilemplayer.spec

          Remove-Item Env:SMILEMPLAYER_ONEFILE

          if (-not (Test-Path "dist\SmileMPlayer.exe")) {
            Write-Error "PyInstaller onefile build failed."
            exit 1
          }

      - name: Prepare Windows release artifacts
        shell: pwsh
        run: |
          $version = (python installer\get_version.py).Trim()
          $artifactDir = "windows-release"

          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          Copy-Item `
            "SmileMPlayer-$version-windows-x64.zip" `
            "$artifactDir\SmileMPlayer-$version-windows-x64.zip"

          Copy-Item `
            "dist\SmileMPlayer.exe" `
            "$artifactDir\SmileMPlayer-$version-windows-x64.exe"

          Write-Host "Windows release artifacts:"
          Get-ChildItem $artifactDir |
            Select-Object Name, Length, FullName

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: smilemplayer-windows
          path: windows-release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - arch
      - debian
      - fedora
      - wheel
      - windows

    permissions:
      contents: write

    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v8
        with:
          name: smilemplayer-arch-package
          path: artifacts/arch

      - name: Download Debian package
        uses: actions/download-artifact@v8
        with:
          name: smilemplayer-debian-package
          path: artifacts/debian

      - name: Download Fedora RPM
        uses: actions/download-artifact@v8
        with:
          name: smilemplayer-fedora-rpm
          path: artifacts/fedora

      - name: Download Python wheel
        uses: actions/download-artifact@v8
        with:
          name: smilemplayer-python-wheel
          path: artifacts/python

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: smilemplayer-windows
          path: artifacts/windows

      - name: Verify artifacts
        run: |
          set -e

          echo "Arch:"
          find artifacts/arch -type f -print

          echo "Debian:"
          find artifacts/debian -type f -print

          echo "Fedora:"
          find artifacts/fedora -type f -print

          echo "Python:"
          find artifacts/python -type f -print

          echo "Windows:"
          find artifacts/windows -type f -print

          test -n "$(find artifacts/arch \
            -type f \
            -name '*.pkg.tar.zst' \
            -print -quit)"

          test -n "$(find artifacts/debian \
            -type f \
            -name '*.deb' \
            -print -quit)"

          test -n "$(find artifacts/fedora \
            -type f \
            -name '*.rpm' \
            -print -quit)"

          test -n "$(find artifacts/python \
            -type f \
            -name '*.whl' \
            -print -quit)"

          test -n "$(find artifacts/windows \
            -type f \
            -name '*.zip' \
            -print -quit)"

          test -n "$(find artifacts/windows \
            -type f \
            -name '*.exe' \
            -print -quit)"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          repo="${GITHUB_REPOSITORY}"
          tag="${GITHUB_REF_NAME}"
          commit_sha="${GITHUB_SHA}"

          commit_message="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/commits/${commit_sha}" |
            python3 -c \
              'import json,sys; print(json.load(sys.stdin)["commit"]["message"])'
          )"

          notes="$(printf '%s\n' "$commit_message" | sed '1d')"

          release_json="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/releases/tags/${tag}" \
            || true
          )"

          if printf '%s' "$release_json" |
              python3 -c \
                'import json,sys; d=json.load(sys.stdin); sys.exit(0 if "id" in d else 1)' \
              2>/dev/null; then

            echo "Release ${tag} already exists."

            release_id="$(
              printf '%s' "$release_json" |
              python3 -c \
                'import json,sys; print(json.load(sys.stdin)["id"])'
            )"

            upload_url="$(
              printf '%s' "$release_json" |
              python3 -c \
                'import json,sys; print(json.load(sys.stdin)["upload_url"])'
            )"

            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/releases/${release_id}" \
              -d "$(
                python3 -c \
                  'import json,sys; print(json.dumps({"name":sys.argv[1],"body":sys.argv[2]}))' \
                  "$tag" "$notes"
              )" \
              >/dev/null

          else

            echo "Creating release ${tag}."

            release_json="$(
              curl -fsSL -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${repo}/releases" \
                -d "$(
                  python3 -c \
                    'import json,sys; print(json.dumps({"tag_name":sys.argv[1],"name":sys.argv[1],"body":sys.argv[2],"draft":False,"prerelease":False}))' \
                    "$tag" "$notes"
                )"
            )"

            upload_url="$(
              printf '%s' "$release_json" |
              python3 -c \
                'import json,sys; print(json.load(sys.stdin)["upload_url"])'
            )"
          fi

          upload_url="${upload_url%\{*}"

          find artifacts -type f -print0 |
          while IFS= read -r -d '' file; do
            asset_name="$(basename "$file")"

            echo "Uploading ${asset_name}..."

            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "${upload_url}?name=$(python3 -c \
                'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' \
                "$asset_name")" \
              >/dev/null

            echo "Uploaded ${asset_name}."
          done

          echo "Release ${tag} published successfully."
