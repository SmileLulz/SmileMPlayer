name: Build Python wheel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: python:3.14-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          python -m pip install --no-cache-dir \
            build \
            hatchling \
            twine

      - name: Build wheel
        run: |
          python -m build --wheel --no-isolation

      - name: Verify wheel
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"

          if [ -z "$wheel" ]; then
            echo "ERROR: No wheel was produced."
            exit 1
          fi

          echo "Built wheel: $wheel"

          python -m twine check "$wheel"

      - name: Inspect wheel
        run: |
          python -m zipfile -l \
            "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: smilemplayer-python-wheel
          path: dist/*.whl

      - name: Upload wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="${GITHUB_REF_NAME}"

          release_json="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${title}"
          )"

          upload_url="$(
            printf '%s' "$release_json" |
              python -c \
                'import json,sys; print(json.load(sys.stdin)["upload_url"])'
          )"

          upload_url="${upload_url%\{*}"

          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          asset_name="$(basename "$wheel")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${wheel}" \
            "${upload_url}?name=$(python -c \
              'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' \
              "$asset_name")" \
            >/dev/null

          echo "Uploaded ${asset_name} to ${title}."
