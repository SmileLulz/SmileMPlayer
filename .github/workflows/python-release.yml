name: Build Python wheel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: python:3.14-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl
          python -m pip install --no-cache-dir \
            build \
            hatchling \
            twine

      - name: Build wheel
        run: |
          python -m build --wheel --no-isolation

      - name: Verify wheel
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"

          if [ -z "$wheel" ]; then
            echo "ERROR: No wheel was produced."
            exit 1
          fi

          echo "Built wheel: $wheel"

          python -m twine check "$wheel"

      - name: Inspect wheel
        run: |
          python -m zipfile -l \
            "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: smilemplayer-python-wheel
          path: dist/*.whl

      - name: Create or update GitHub Release and upload wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="${GITHUB_REF_NAME}"

          commit_message="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" |
            python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["message"])'
          )"

          notes="$(printf '%s\n' "$commit_message" | sed '1d')"

          release_json="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${title}" \
            || true
          )"

          if printf '%s' "$release_json" |
              python -c \
                'import json,sys; d=json.load(sys.stdin); sys.exit(0 if "id" in d else 1)' \
              2>/dev/null; then

            echo "Release ${title} already exists."

            release_id="$(
              printf '%s' "$release_json" |
              python -c 'import json,sys; print(json.load(sys.stdin)["id"])'
            )"

            upload_url="$(
              printf '%s' "$release_json" |
              python -c 'import json,sys; print(json.load(sys.stdin)["upload_url"])'
            )"

            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -d "$(
                python -c \
                  'import json,sys; print(json.dumps({"name":sys.argv[1],"body":sys.argv[2]}))' \
                  "$title" "$notes"
              )" \
              >/dev/null

          else

            echo "Release ${title} does not exist yet. Creating it."

            release_json="$(
              curl -fsSL -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
                -d "$(
                  python -c \
                    'import json,sys; print(json.dumps({"tag_name":sys.argv[1],"name":sys.argv[1],"body":sys.argv[2],"draft":False,"prerelease":False}))' \
                    "$title" "$notes"
                )"
            )"

            upload_url="$(
              printf '%s' "$release_json" |
              python -c 'import json,sys; print(json.load(sys.stdin)["upload_url"])'
            )"
          fi

          upload_url="${upload_url%\{*}"

          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"

          if [ -z "$wheel" ]; then
            echo "ERROR: No wheel found."
            exit 1
          fi

          asset_name="$(basename "$wheel")"

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${wheel}" \
            "${upload_url}?name=$(python -c \
              'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' \
              "$asset_name")" \
            >/dev/null

          echo "Uploaded ${asset_name} to ${title}."
