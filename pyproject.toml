[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smilemplayer"
version = "0.9.1"
description = "A simple and modern-looking playlist-based local music player for Linux"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SmileLulz" }]
license = { text = "GPL-3.0-only" }
dependencies = [
  "PySide6>=6.8",
  "mutagen>=1.47",
]

[project.urls]
Repository = "https://github.com/SmileLulz/SmileMPlayer"

[project.scripts]
smilemplayer = "smilemplayer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["smilemplayer"]
include = ["smilemplayer/resources/qml/**/*"]

[tool.hatch.build.targets.sdist]
include = [
  "/smilemplayer",
  "/README.md",
  "/LICENSE",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
